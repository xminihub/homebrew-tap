name: Backfill formulae

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  # The bump workflow it calls commits Formula changes.
  contents: write
  issues: write

jobs:
  plan:
    name: Find formulae behind upstream releases
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.plan.outputs.tools }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare upstream latest with the pinned version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools="[]"
          for config in tools/*.json; do
            name="$(jq -r '.name' "$config")"
            repo="$(jq -r '.repo' "$config")"
            latest="$(gh release view --repo "$repo" --json tagName \
              --jq '.tagName | sub("^v"; "")')" || {
              echo "$name: $repo has no release to compare against"
              continue
            }
            pinned="$(sed -n 's#.*/releases/download/v\([^/]*\)/.*#\1#p' \
              "Formula/$name.rb" 2>/dev/null | head -1 || true)"
            echo "$name: upstream=$latest pinned=${pinned:-none}"
            if [ "$latest" = "$pinned" ]; then
              continue
            fi
            tools="$(jq -cn --argjson t "$tools" --arg n "$name" --arg v "$latest" \
              '$t + [{name: $n, version: $v}]')"
          done
          echo "tools=$(printf '%s' "$tools" | jq -c .)" >> "$GITHUB_OUTPUT"

  bump:
    name: Bump ${{ matrix.name }} to ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.tools != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tools) }}
    uses: ./.github/workflows/bump.yml
    with:
      name: ${{ matrix.name }}
      version: ${{ matrix.version }}

  report:
    name: Report formulae still behind upstream
    needs: [plan, bump]
    if: needs.plan.outputs.tools != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: File or refresh a stale-formula issue per unconverged tool
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS: ${{ needs.plan.outputs.tools }}
        run: |
          set -euo pipefail
          for entry in $(printf '%s' "$TOOLS" | jq -c '.[]'); do
            name="$(printf '%s' "$entry" | jq -r '.name')"
            version="$(printf '%s' "$entry" | jq -r '.version')"
            repo="$(jq -r '.repo' "tools/$name.json")"
            pinned="$(sed -n 's#.*/releases/download/v\([^/]*\)/.*#\1#p' \
              "Formula/$name.rb" 2>/dev/null | head -1 || true)"
            if [ "$pinned" = "$version" ]; then
              echo "$name converged on $version"
              continue
            fi
            title="$name formula is stuck behind $version"
            body="The backfill dispatched a bump of \`$name\` to \`$version\` (latest release of \`$repo\`) and \`Formula/$name.rb\` still pins \`${pinned:-nothing}\`. The bump run failed or its gates rejected the assets — check the bump workflow run for \`$name\` and re-run it once the release assets exist."
            existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label stale-formula --search "$name formula is stuck in:title" \
              --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --body "$body" --label stale-formula
            fi
          done
