name: Bump formula

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Tool name (a tools/<name>.json entry)"
        required: true
        type: string
        default: lim
      version:
        description: "Upstream release version, without the v tag prefix"
        required: true
        type: string
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: bump-${{ inputs.name }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  bump:
    name: Bump ${{ inputs.name }} to ${{ inputs.version }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-tap

      - name: Checksum the published release assets
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        # Asset names come from scripts/render.mjs, the only place they are
        # derived: a product that stops publishing one of them fails here
        # instead of pinning a URL that 404s for those users.
        run: |
          set -euo pipefail
          test -f "tools/$NAME.json" || {
            echo "::error::no tools/$NAME.json in this tap"
            exit 1
          }
          repo="$(jq -r '.repo' "tools/$NAME.json")"
          if ! gh release view "v$VERSION" --repo "$repo" >/dev/null; then
            echo "::error::$repo has no release v$VERSION to bump $NAME from"
            exit 1
          fi
          node scripts/render.mjs assets "$NAME" "$VERSION" > assets-map.json
          map="{}"
          while IFS=$'\t' read -r target asset; do
            if ! gh release download "v$VERSION" --repo "$repo" \
                --pattern "$asset" --clobber --dir dist; then
              echo "::error::$repo v$VERSION publishes no $asset asset"
              echo "::error::$NAME must publish " \
                "<bin>-<version>-<brew target>.tar.gz for every brew target"
              exit 1
            fi
            sha="$(shasum -a 256 "dist/$asset" | cut -d' ' -f1)"
            map="$(jq -cn --argjson m "$map" --arg t "$target" --arg s "$sha" \
              '$m + {($t): $s}')"
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' assets-map.json)
          printf '%s\n' "$map" > assets.json
          jq -r 'to_entries[] | "\(.key): \(.value)"' assets.json

      - name: Render formula
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p Formula
          node scripts/render.mjs formula "$NAME" "$VERSION" assets.json \
            "Formula/$NAME.rb"

      - name: Verify formula
        env:
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          brew style --fix "Formula/$NAME.rb"
          brew style "Formula/$NAME.rb"
          brew fetch --formula "xminihub/tap/$NAME"
          brew audit --formula --strict --online "xminihub/tap/$NAME"

      - name: Commit the formula
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/$NAME.rb"
          if git diff --cached --quiet; then
            echo "Formula/$NAME.rb already pins $VERSION; nothing to push"
            exit 0
          fi
          git commit -m "$NAME $VERSION"
          # Two tools releasing at once both push to main: rebase over the
          # other formula rather than losing its commit.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:main"; then
              echo "Formula/$NAME.rb pinned $VERSION on attempt $attempt"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep "$((attempt * 3))"
          done
          echo "::error::could not push Formula/$NAME.rb after 5 attempts"
          exit 1
