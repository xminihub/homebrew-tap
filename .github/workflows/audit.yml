name: Audit tap

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "templates/**"
      - "tools/**"
      - "scripts/**"
      - ".github/**"
  pull_request:
    paths:
      - "Formula/**"
      - "templates/**"
      - "tools/**"
      - "scripts/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  audit:
    name: Style and audit every formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-tap

      - name: Audit formulae
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(Formula/*.rb)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no formulae in this tap yet"
            exit 0
          fi
          names=()
          for file in "${files[@]}"; do
            brew style "$file"
            names+=("xminihub/tap/$(basename "$file" .rb)")
          done
          brew audit --formula --strict --online "${names[@]}"
